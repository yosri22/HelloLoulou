apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-loulou
spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-loulou

  template:
    metadata:
      labels:
        app: hello-loulou

    spec:
      containers:
        - name: hello-loulou
          image: hello-loulou:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080